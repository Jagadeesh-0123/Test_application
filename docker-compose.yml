services:
  inventory-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: Enterprise Inventory Orchestrator
      API_KEY_SECRET: ${API_KEY_SECRET:?Set API_KEY_SECRET in .env}
      DATABASE_URL: sqlite+aiosqlite:////data/enterprise_inventory.db
    command:
      - sh
      - -c
      - python -m app.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - inventory_data:/data
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  inventory_data: